<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLACKOUT</title>
<style>
  :root {
    --bg: #0B0D0E;
    --fg: #ECEAE3;
    --dim: rgba(236, 234, 227, 0.55);
    --hairline: rgba(236, 234, 227, 0.20);
    --accent: #5FD0E6;
    --lh: 24px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
  }

  body {
    display: flex;
    flex-direction: column;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: var(--lh);
    overflow-x: hidden;
  }

  a {
    color: var(--accent);
  }

  /* ---------- status bar ---------- */

  #status-bar {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 24px;
    padding: 24px;
    border-bottom: 1px solid var(--hairline);
    background: var(--bg);
  }

  #status-bar .brand {
    font: inherit;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--fg);
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }

  #status-bar .brand:hover,
  #status-bar .brand:focus {
    color: var(--accent);
    outline: none;
  }

  #status-bar .fields {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    color: var(--dim);
  }

  #status-bar .fields span:not(:last-child)::after {
    content: " \00B7";
    margin-left: 8px;
    color: var(--dim);
  }

  /* ---------- content area ---------- */

  #content {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #content.pre-search {
    justify-content: center;
  }

  /* ---------- launch (search box + hint) ---------- */

  #launch {
    padding: 24px;
  }

  #content.pre-search #launch {
    max-width: 70ch;
    width: 100%;
    margin: 0 auto;
  }

  #content.post-search #launch {
    border-bottom: 1px solid var(--hairline);
  }

  .hero-label {
    color: var(--dim);
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  #content.post-search .hero-label {
    display: none;
  }

  #search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--hairline);
    padding: 12px 16px;
  }

  #search-box .chevron {
    color: var(--dim);
  }

  #hint {
    margin-top: 24px;
    color: var(--dim);
    font-size: 13px;
  }

  #content.post-search #hint {
    display: none;
  }

  /* ---------- answer choices ---------- */

  .choice {
    display: block;
    width: 100%;
    font: inherit;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--hairline);
    border-left-width: 2px;
    padding: 12px 16px;
    margin-bottom: 8px;
    cursor: pointer;
    text-align: left;
  }

  .choice:hover, .choice:focus {
    border-color: var(--accent);
    outline: none;
  }

  .choice .answer-text {
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }

  .choice .key {
    color: var(--dim);
  }

  .choice:hover .key, .choice:focus .key {
    color: var(--accent);
  }

  /* ---------- protocol view ---------- */

  .back-link {
    font: inherit;
    color: var(--accent);
    background: none;
    border: 0;
    padding: 0;
    margin-bottom: 24px;
    cursor: pointer;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    font-size: 13px;
  }

  .protocol-title {
    font-weight: 700;
    overflow-wrap: break-word;
  }

  .protocol-sub {
    margin-top: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--hairline);
    color: var(--dim);
    font-size: 13px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .part {
    padding-top: 24px;
  }

  .part-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 13px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .part-head > * + *::before {
    content: "·  ";
    color: var(--dim);
  }

  .part-head .part-label {
    color: var(--fg);
  }

  .part-head .from-answer {
    color: var(--accent);
  }

    /* ---------- input / cursor ---------- */

  .input-wrap {
    position: relative;
    flex: 1 1 auto;
    height: var(--lh);
    min-width: 0;
  }

  .echo-line {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    white-space: pre;
    overflow: hidden;
  }

  .echo-text {
    white-space: pre;
  }

  .cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.1em;
    margin-left: 1px;
    background: var(--accent);
    animation: blink 1s steps(1, jump-none) infinite;
    flex: 0 0 auto;
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor {
      animation: none;
    }
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  #query-input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    margin: 0;
    padding: 0;
    background: transparent;
    color: transparent;
    caret-color: transparent;
    font: inherit;
    outline: none;
  }

  /* ---------- scrollback ---------- */

  #scrollback-wrap {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
  }

  #content.pre-search #scrollback-wrap {
    display: none;
  }

  #scrollback {
    max-width: 80ch;
    padding: 24px;
  }

  .exchange {
    padding-top: 24px;
    padding-bottom: 24px;
  }

  .exchange:not(:first-child) {
    border-top: 1px solid var(--hairline);
  }

  .exchange:first-child {
    padding-top: 0;
  }

  .query-line {
    color: var(--fg);
    margin-bottom: 24px;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }

  .query-line::before {
    content: "> ";
    color: var(--dim);
  }

  .result-loading {
    color: var(--dim);
  }

  .result-block + .result-block {
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid var(--hairline);
  }

  .passage {
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }

  .meta-row {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px;
    font-size: 13px;
  }

  .score-badge {
    color: var(--fg);
    border: 1px solid var(--hairline);
    padding: 1px 6px;
  }

  .meta-text {
    color: var(--dim);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    overflow-wrap: break-word;
  }

  .pdf-link {
    letter-spacing: 0.02em;
    text-transform: uppercase;
    text-decoration: none;
    white-space: nowrap;
  }

  .pdf-link:hover, .pdf-link:focus {
    text-decoration: underline;
  }

  .refusal {
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .refusal-meta {
    margin-top: 8px;
    color: var(--dim);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  @media (max-width: 900px) {
    #status-bar, #launch, #scrollback {
      padding-left: 16px;
      padding-right: 16px;
    }
  }
</style>
</head>
<body>

  <div id="status-bar">
    <button class="brand" type="button" id="home-btn" aria-label="Return to search home">BLACKOUT</button>
    <div class="fields">
      <span>OFFLINE</span>
      <span id="stat-manuals">— MANUALS</span>
      <span id="stat-protocols">— PROTOCOLS</span>
      <span>0 EXTERNAL CALLS</span>
    </div>
  </div>

  <div id="content" class="pre-search">
    <div id="launch">
      <div class="hero-label">Ask a protocol question</div>
      <div id="search-box">
        <span class="chevron">&gt;</span>
        <div class="input-wrap">
          <div class="echo-line">
            <span class="echo-text" id="echo-text"></span><span class="cursor"></span>
          </div>
          <input id="query-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Query input" autofocus>
        </div>
      </div>
      <div id="hint">Ask in plain English. Three answers come back — open one to read the whole protocol.</div>
    </div>

    <div id="scrollback-wrap">
      <div id="scrollback"></div>
    </div>
  </div>

<script>
  /* ============================================================
     BLACKOUT UI

     Two states after a question:
       ANSWERS   one verbatim sentence from each of the top 3 protocols
       PROTOCOL  the protocol behind the chosen sentence, part by part,
                 each part cited to the page it is printed on

     All data comes from backend/server.py, which calls search.py.
     Nothing here is generated: every line shown is manual text.
     ============================================================ */

  const API = {
    async search(question) {
      const res = await fetch('/api/search', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, k: 3 })
      });
      if (!res.ok) throw new Error('search failed: ' + res.status);
      return await res.json();
    },
    async stats() {
      const res = await fetch('/api/stats');
      if (!res.ok) throw new Error('stats failed: ' + res.status);
      return await res.json();
    }
  };

  // manual name -> {short, pdf}, filled in from /api/stats so the backend stays the one
  // place that knows which manuals are loaded
  const MANUALS = {};

  function shortName(manual) {
    return (MANUALS[manual] && MANUALS[manual].short) || manual;
  }

  function pdfLink(manual, page) {
    const pdf = MANUALS[manual] && MANUALS[manual].pdf;
    return pdf ? pdf + '#page=' + page : null;
  }

  function pageLabel(page, printed) {
    // the PDF page is what the link jumps to; the printed page is what the paper copy
    // shows, and the WV protocols print none
    return printed ? 'p.' + page + ' (printed ' + printed + ')' : 'p.' + page;
  }

  function partTitle(section, protocol) {
    // "T008 - Burns - Normal Saline (2/2)" under protocol "T008 - Burns" -> "Normal Saline (2/2)"
    if (section.startsWith(protocol)) {
      const rest = section.slice(protocol.length).replace(/^\s*[-–]\s*/, '').trim();
      if (rest) return rest;
    }
    return section === protocol ? '' : section;
  }

  const content = document.getElementById('content');
  const scrollback = document.getElementById('scrollback');
  const scrollbackWrap = document.getElementById('scrollback-wrap');
  const queryInput = document.getElementById('query-input');
  const echoText = document.getElementById('echo-text');
  const homeBtn = document.getElementById('home-btn');

  let hasSearched = false;
  let currentResults = [];   // the results on screen, selectable by number key

  /* ---------------------------------------------- status bar */

  async function loadStats() {
    try {
      const stats = await API.stats();
      stats.manuals.forEach(m => { MANUALS[m.manual] = { short: m.short, pdf: m.pdf }; });
      document.getElementById('stat-manuals').textContent =
        stats.manuals.length + ' MANUALS';
      document.getElementById('stat-protocols').textContent =
        stats.protocols.toLocaleString() + ' PROTOCOLS';
    } catch (err) {
      document.getElementById('stat-manuals').textContent = 'BACKEND OFFLINE';
      document.getElementById('stat-protocols').textContent = '';
    }
  }

  /* ---------------------------------------------- answer choices */

  function renderChoices(container, response) {
    container.innerHTML = '';
    currentResults = [];

    if (!response.confident || !response.results || response.results.length === 0) {
      const refusal = document.createElement('div');
      refusal.className = 'refusal';
      refusal.textContent = 'NOT COVERED IN LOADED PROTOCOLS';

      const meta = document.createElement('div');
      meta.className = 'refusal-meta';
      meta.textContent = 'TOP SCORE ' + response.top_score.toFixed(2);

      container.appendChild(refusal);
      container.appendChild(meta);
      return;
    }

    currentResults = response.results;
    response.results.forEach((result, n) => {
      const choice = document.createElement('button');
      choice.className = 'choice';
      choice.type = 'button';

      const answer = document.createElement('div');
      answer.className = 'answer-text';

      const key = document.createElement('span');
      key.className = 'key';
      key.textContent = '[' + (n + 1) + '] ';
      answer.appendChild(key);
      answer.appendChild(document.createTextNode(result.answer));

      const metaRow = document.createElement('div');
      metaRow.className = 'meta-row';

      const score = document.createElement('span');
      score.className = 'score-badge';
      score.textContent = result.score.toFixed(2);

      const metaText = document.createElement('span');
      metaText.className = 'meta-text';
      metaText.textContent = shortName(result.manual) + '  ·  ' + result.protocol +
        '  ·  p.' + result.answer_page;

      metaRow.appendChild(score);
      metaRow.appendChild(metaText);
      choice.appendChild(answer);
      choice.appendChild(metaRow);

      choice.addEventListener('click', () => showProtocol(container, response, result));
      container.appendChild(choice);
    });
  }

  /* ---------------------------------------------- protocol view */

  function showProtocol(container, response, result) {
    const protocol = result.chunk;
    container.innerHTML = '';
    currentResults = [];

    const back = document.createElement('button');
    back.className = 'back-link';
    back.type = 'button';
    back.textContent = '← back to answers';
    back.addEventListener('click', () => {
      renderChoices(container, response);
      queryInput.focus();
    });
    container.appendChild(back);

    const title = document.createElement('div');
    title.className = 'protocol-title';
    title.textContent = protocol.protocol;
    container.appendChild(title);

    const pages = protocol.pages;
    const span = pages.length > 1
      ? 'pp.' + pages[0] + '–' + pages[pages.length - 1]
      : 'p.' + pages[0];
    const sub = document.createElement('div');
    sub.className = 'protocol-sub';
    sub.textContent = shortName(protocol.manual) + '  ·  ' + span +
      '  ·  ' + protocol.passages.length +
      (protocol.passages.length === 1 ? ' part' : ' parts');
    container.appendChild(sub);

    protocol.passages.forEach((passage, n) => {
      const part = document.createElement('div');
      part.className = 'part';

      const head = document.createElement('div');
      head.className = 'part-head';

      const label = document.createElement('span');
      label.className = 'part-label';
      const which = protocol.passages.length > 1
        ? 'part ' + (n + 1) + ' of ' + protocol.passages.length + '  ·  '
        : '';
      label.textContent = which + pageLabel(passage.page, passage.printed_page);
      head.appendChild(label);

      const heading = partTitle(passage.section, protocol.protocol);
      if (heading) {
        const sect = document.createElement('span');
        sect.textContent = heading;
        head.appendChild(sect);
      }

      if (passage.chunk_id === result.answer_chunk_id) {
        const marker = document.createElement('span');
        marker.className = 'from-answer';
        marker.textContent = '◂ answer from here';
        head.appendChild(marker);
      }

      const link = pdfLink(protocol.manual, passage.page);
      if (link) {
        const a = document.createElement('a');
        a.className = 'pdf-link';
        a.href = link;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = 'open pdf →';
        head.appendChild(a);
      }

      const text = document.createElement('div');
      text.className = 'passage';
      text.textContent = passage.text;

      part.appendChild(head);
      part.appendChild(text);
      container.appendChild(part);
    });

    scrollbackWrap.scrollTop = 0;
  }

  /* ---------------------------------------------- asking */

  async function submitQuery(question) {
    if (!hasSearched) {
      hasSearched = true;
      content.classList.remove('pre-search');
      content.classList.add('post-search');
    }

    // one question on screen at a time: a new question replaces the last
    scrollback.innerHTML = '';
    currentResults = [];

    const exchange = document.createElement('div');
    exchange.className = 'exchange';

    const queryLine = document.createElement('div');
    queryLine.className = 'query-line';
    queryLine.textContent = question;

    const resultContainer = document.createElement('div');
    resultContainer.className = 'result-loading';
    resultContainer.textContent = 'SEARCHING PROTOCOLS';

    exchange.appendChild(queryLine);
    exchange.appendChild(resultContainer);
    scrollback.appendChild(exchange);
    scrollbackWrap.scrollTop = 0;

    try {
      const response = await API.search(question);
      resultContainer.className = '';
      renderChoices(resultContainer, response);
    } catch (err) {
      resultContainer.className = 'refusal';
      resultContainer.textContent = 'SEARCH UNAVAILABLE — IS THE SERVER RUNNING?';
    }
  }

  function goHome() {
    hasSearched = false;
    currentResults = [];
    content.classList.remove('post-search');
    content.classList.add('pre-search');
    scrollback.innerHTML = '';
    queryInput.value = '';
    echoText.textContent = '';
    queryInput.focus();
  }

  queryInput.addEventListener('input', () => {
    echoText.textContent = queryInput.value;
  });

  queryInput.addEventListener('keydown', (e) => {
    // with the input empty, 1-3 open that answer, the way a terminal menu would
    if (queryInput.value === '' && currentResults.length && /^[1-9]$/.test(e.key)) {
      const choice = scrollback.querySelectorAll('.choice')[Number(e.key) - 1];
      if (choice) {
        e.preventDefault();
        choice.click();
        return;
      }
    }
    if (e.key === 'Enter') {
      const value = queryInput.value.trim();
      if (value === '') return;
      queryInput.value = '';
      echoText.textContent = '';
      submitQuery(value);
    }
  });

  homeBtn.addEventListener('click', goHome);

  scrollbackWrap.addEventListener('click', (e) => {
    if (window.getSelection().toString() === '' && !e.target.closest('button, a')) {
      queryInput.focus();
    }
  });

  loadStats();
  queryInput.focus();
</script>

</body>
</html>
